name: CI - Frontend

# O E2E full-stack tambem depende do backend, do compose e do Makefile.
on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "backend/**"
      - "compose.yaml"
      - "Makefile"
      - ".github/workflows/ci-frontend.yml"
  pull_request:
    paths:
      - "frontend/**"
      - "backend/**"
      - "compose.yaml"
      - "Makefile"
      - ".github/workflows/ci-frontend.yml"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Linter
        run: npm run lint

  test:
    name: Tests
    needs: lint
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Check Formatting
        run: npm run format:check

      - name: Run Unit and Integration Tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Install Playwright Browser
        run: npx playwright install --with-deps chromium

      # Sobe db + api + frontend isolados (lab-e2e), migra, roda o Playwright e derruba a stack.
      - name: Run Full-stack E2E Tests
        working-directory: .
        run: make e2e

      - name: Upload Playwright Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
