name: CI - Frontend

on:
  push:
    branches: [main, projeto-final]
    paths:
      - "frontend/**"
      - ".github/workflows/ci-frontend.yml"
  # Sem filtro de paths: o PR final para a main sempre roda o frontend inteiro.
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Biome, Vitest e build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      # Mesma versao de Node do frontend/Dockerfile.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Lint (Biome)
        run: npm run lint

      - name: Check Formatting (Biome)
        run: npm run format:check

      - name: Unit and Integration Tests (Vitest)
        run: npm run test

      - name: Build (Vite)
        run: npm run build
